name: 'Generate Changelog'

on:
  push:
    tags:
      - 'v*'

jobs:
  Changelog:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Git repository with history for all branches and tags'
        uses: actions/checkout@v2.3.4
        with:
          fetch-depth: 0

      - name: 'Set previous Git tag'
        id: tags
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: echo "previous=$(git describe --tags --abbrev=0 --exclude "$CURRENT_TAG")" >> "$GITHUB_OUTPUT"

      - name: 'Print environment variables'
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}
        run: |
          echo "PREVIOUS_TAG = $PREVIOUS_TAG"
          echo "CURRENT_TAG = $CURRENT_TAG"
          echo "Node.js version = $(node --version)"

      - name: 'Generate changelog'
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}
        run: |
          echo "{}" > ./package.json
          npx generate-changelog@1.8.0 -t "$PREVIOUS_TAG...$CURRENT_TAG"

      - name: 'Attach changelog to tag'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{github.token}}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ./CHANGELOG.md
          draft: false
          prerelease: false
